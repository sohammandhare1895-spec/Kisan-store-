# ═══════════════════════════════════════════════════════════════
# Kisan Store — docker-compose.yml
# One command to boot the whole platform (site + API + DB file).
#
#   docker compose up --build
# ═══════════════════════════════════════════════════════════════

services:
  kisan-store:
    build: .
    container_name: kisan-store
    ports:
      - "8000:8000"
    volumes:
      # Persist uploads & the SQLite database across restarts
      - kisan_uploads:/app/uploads
      - kisan_db:/app/backend/data
    restart: unless-stopped
    environment:
      PORT: "8000"

volumes:
  kisan_uploads:
  kisan_db:
