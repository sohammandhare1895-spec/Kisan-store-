# ═══════════════════════════════════════════════════════════════
# Kisan Store — GitHub Actions: publish to GitHub Pages
# The site is static (index.html + assets/js + data), so Pages can
# host the repo root as-is. A verify job runs the language-agnostic
# checks first; deployment only happens if they pass.
# ═══════════════════════════════════════════════════════════════

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate TSV + verify all language ports agree
        run: |
          python3 scripts/gen_tsv.py
          python3 scripts/verify_consistency.py
      - name: Node smoke test (DOM-free app logic)
        run: node scripts/smoke_test.mjs
      - name: Python unit tests (reward engine)
        run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate catalog.tsv (keeps generated artifacts fresh)
        run: python3 scripts/gen_tsv.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
